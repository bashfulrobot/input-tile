name: InputTile
options:
  bundleIdPrefix: com.bashfulrobot
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Team ID, or pick it in Xcode > Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
targets:
  InputTile:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    entitlements:
      path: App/App.entitlements
      properties: {}
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Input Tile
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: com.bashfulrobot.InputTile
            CFBundleURLSchemes: [inputtile]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bashfulrobot.InputTile
    dependencies:
      - target: InputTileWidget
        embed: true
  InputTileWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Input Tile
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bashfulrobot.InputTile.Widget
        SKIP_INSTALL: YES
