name: InputTile
options:
  bundleIdPrefix: com.bashfulrobot
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Team ID, or pick it in Xcode > Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
targets:
  InputTile:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    entitlements:
      path: App/App.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bashfulrobot.InputTile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    dependencies:
      - target: InputTileWidget
        embed: true
  InputTileWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    entitlements:
      path: Widget/Widget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Input Tile
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bashfulrobot.InputTile.Widget
        SKIP_INSTALL: YES
